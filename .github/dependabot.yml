version: 2

updates:
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "08:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore(dotnet-sdk):"

  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/src"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore(nuget):"
    groups:
      nuget:
        patterns:
          - "*"
